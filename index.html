<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>田中电子宠物</title>
  <link rel="preload" as="image" href="assets/tanaka-stand.webp">
  <link rel="preload" as="image" href="assets/tanaka-xiaohe-bite.webp">
  <link rel="preload" as="image" href="assets/tanaka-xiuzhen-fan.webp">
  <style>
    :root {
      color-scheme: light;
      --ink: #241f1b;
      --muted: #6d625b;
      --paper: #fffaf0;
      --panel: rgba(255, 252, 244, .92);
      --line: rgba(36, 31, 27, .18);
      --hard-line: #2b2520;
      --orange: #f2832f;
      --orange-dark: #ca5f1f;
      --leaf: #77b94a;
      --mint: #79c7b4;
      --blue: #7ba9d8;
      --rose: #e37b74;
      --yellow: #f4c85b;
      --shadow: 0 18px 46px rgba(67, 49, 34, .16);
      --stage-h: clamp(390px, 60svh, 560px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100svh;
      color: var(--ink);
      background: linear-gradient(155deg, #fff3d2 0%, #e7f2f7 52%, #eef6e5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body.theme-morning {
      background: linear-gradient(155deg, #ffe8b6 0%, #ffd8cf 48%, #ddf4e7 100%);
    }

    body.theme-day {
      background: linear-gradient(155deg, #fff5cf 0%, #dcf0ff 52%, #e8f5df 100%);
    }

    body.theme-evening {
      background: linear-gradient(155deg, #ffd2a4 0%, #f4c7c4 50%, #cde7ee 100%);
    }

    body.theme-night {
      color: #fbf2e5;
      background: linear-gradient(155deg, #16192a 0%, #26334d 55%, #1f4345 100%);
    }

    button {
      appearance: none;
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .app {
      width: min(100%, 540px);
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 32px);
      line-height: 1.05;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .subline {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    body.theme-night .subline,
    body.theme-night .stat-label,
    body.theme-night .caption,
    body.theme-night .value-note {
      color: rgba(251, 242, 229, .75);
    }

    .top-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn,
    .small-btn {
      min-height: 36px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .64);
      border-radius: 8px;
      padding: 0 10px;
      box-shadow: 0 8px 20px rgba(70, 50, 35, .08);
    }

    body.theme-night .icon-btn,
    body.theme-night .small-btn,
    body.theme-night .panel {
      background: rgba(25, 27, 38, .74);
      border-color: rgba(255, 242, 221, .16);
    }

    .stage-shell {
      position: relative;
      height: var(--stage-h);
      border: 1px solid rgba(36, 31, 27, .12);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      background: #dff4ff;
      isolation: isolate;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.36), transparent 45%),
        linear-gradient(180deg, #caedff 0%, #eaf8fd 58%, #ccebc7 59%, #b9dfaa 100%);
    }

    body.theme-morning .stage {
      background:
        linear-gradient(180deg, rgba(255,244,206,.5), transparent 44%),
        linear-gradient(180deg, #ffd9a8 0%, #ffe7ce 58%, #cfe9c0 59%, #acd795 100%);
    }

    body.theme-evening .stage {
      background:
        linear-gradient(180deg, rgba(255,229,190,.4), transparent 45%),
        linear-gradient(180deg, #f5b99a 0%, #ffd1c4 58%, #b9d9be 59%, #95c881 100%);
    }

    body.theme-night .stage {
      background:
        radial-gradient(circle at 76% 18%, rgba(255,255,255,.16), transparent 17%),
        linear-gradient(180deg, #101729 0%, #1e2b47 58%, #344c3b 59%, #263f32 100%);
    }

    .celestial,
    .weather-layer,
    .ground,
    .prop,
    .pet,
    .speech,
    .mini-layer {
      position: absolute;
    }

    .celestial {
      left: 0;
      right: 0;
      top: 0;
      height: 42%;
      pointer-events: none;
      z-index: 1;
    }

    .sun,
    .moon {
      position: absolute;
      right: 38px;
      top: 28px;
      width: 58px;
      aspect-ratio: 1;
      border-radius: 999px;
      transition: opacity .4s ease, transform .4s ease;
    }

    .sun {
      background: radial-gradient(circle, #fff7a8 0 34%, #f8c857 36% 62%, rgba(248,200,87,.18) 63% 100%);
      box-shadow: 0 0 42px rgba(247, 195, 72, .48);
    }

    .moon {
      opacity: 0;
      background: #fff0b8;
      box-shadow: 0 0 30px rgba(255, 240, 184, .34);
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      left: -11px;
      top: -4px;
      background: #1b2440;
    }

    body.theme-night .sun { opacity: 0; transform: translateY(18px); }
    body.theme-night .moon { opacity: 1; transform: translateY(0); }

    .cloud {
      position: absolute;
      width: 92px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      box-shadow: 22px -10px 0 6px rgba(255,255,255,.8), 48px -3px 0 10px rgba(255,255,255,.8);
      opacity: .38;
      animation: cloudFloat 18s linear infinite;
    }

    .cloud.one { left: 18px; top: 44px; }
    .cloud.two { left: 58%; top: 95px; transform: scale(.75); animation-duration: 25s; }
    .cloud.three { left: 29%; top: 144px; transform: scale(.52); animation-duration: 21s; }

    .stage[data-weather="cloudy"] .cloud,
    .stage[data-weather="rain"] .cloud,
    .stage[data-weather="snow"] .cloud {
      opacity: .9;
    }

    .stage[data-weather="fog"] .cloud {
      opacity: .62;
    }

    .rain-layer,
    .snow-layer,
    .fog-layer {
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity .35s ease;
    }

    .stage[data-weather="rain"] .rain-layer,
    .stage[data-weather="snow"] .snow-layer,
    .stage[data-weather="fog"] .fog-layer {
      opacity: 1;
    }

    .drop {
      position: absolute;
      top: -34px;
      width: 2px;
      height: 30px;
      border-radius: 999px;
      background: rgba(63, 109, 157, .42);
      animation: rainDrop linear infinite;
    }

    body.theme-night .drop {
      background: rgba(190, 213, 244, .46);
    }

    .flake {
      position: absolute;
      top: -16px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.84);
      animation: snowFall linear infinite;
    }

    .fog-layer::before,
    .fog-layer::after {
      content: "";
      position: absolute;
      left: -12%;
      right: -12%;
      height: 52px;
      border-radius: 999px;
      background: rgba(255,255,255,.36);
      filter: blur(8px);
      animation: fogSlide 13s ease-in-out infinite alternate;
    }

    .fog-layer::before { top: 37%; }
    .fog-layer::after { top: 50%; animation-duration: 17s; }

    .ground {
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 70%, rgba(50, 74, 42, .17), transparent 38%),
        linear-gradient(180deg, transparent 0%, rgba(255,255,255,.18) 100%);
    }

    .stage[data-weather="rain"] .ground {
      background:
        radial-gradient(ellipse at 50% 72%, rgba(28, 51, 47, .24), transparent 38%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 14px, rgba(255,255,255,0) 14px 30px);
    }

    .prop {
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px) scale(.98);
      transition: opacity .24s ease, transform .24s ease;
    }

    .prop.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .desk {
      right: 22px;
      bottom: 54px;
      width: 156px;
      height: 108px;
    }

    .desk .monitor {
      position: absolute;
      right: 10px;
      top: 3px;
      width: 88px;
      height: 58px;
      border: 4px solid var(--hard-line);
      border-radius: 7px;
      background: linear-gradient(135deg, #bfe4ef, #fff4ba);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.4);
    }

    .desk .monitor::after {
      content: "";
      position: absolute;
      left: 29px;
      bottom: -19px;
      width: 26px;
      height: 16px;
      border-left: 4px solid var(--hard-line);
      border-right: 4px solid var(--hard-line);
    }

    .desk .table {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      height: 18px;
      border: 4px solid var(--hard-line);
      border-radius: 9px;
      background: #d8a46e;
    }

    .desk .keyboard {
      position: absolute;
      right: 16px;
      bottom: 42px;
      width: 82px;
      height: 12px;
      border: 3px solid var(--hard-line);
      border-radius: 5px;
      background: #f7f0df;
    }

    .market-bag {
      left: 24px;
      bottom: 58px;
      width: 112px;
      height: 128px;
    }

    .market-bag .bag {
      position: absolute;
      inset: 24px 6px 0;
      border: 4px solid var(--hard-line);
      border-radius: 8px 8px 15px 15px;
      background: linear-gradient(160deg, #fff4bd 0 42%, #f48873 43% 100%);
      box-shadow: inset -8px -8px 0 rgba(0,0,0,.07);
    }

    .market-bag .bag::before {
      content: "";
      position: absolute;
      left: 26px;
      top: -29px;
      width: 38px;
      height: 34px;
      border: 4px solid var(--hard-line);
      border-bottom: 0;
      border-radius: 22px 22px 0 0;
      background: transparent;
    }

    .market-bag .label {
      position: absolute;
      left: 22px;
      top: 72px;
      width: 68px;
      height: 28px;
      border: 3px solid var(--hard-line);
      border-radius: 6px;
      background: rgba(255,255,255,.75);
    }

    .market-bag .label::before,
    .market-bag .label::after {
      content: "";
      position: absolute;
      top: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--hard-line);
    }

    .market-bag .label::before { left: 15px; }
    .market-bag .label::after { right: 15px; }

    .blanket {
      left: 50%;
      bottom: 36px;
      width: min(72%, 330px);
      height: 92px;
      transform: translate(-50%, 12px) scale(.98);
    }

    .blanket.show {
      transform: translate(-50%, 0) scale(1);
    }

    .blanket .pillow {
      position: absolute;
      left: 24px;
      top: 3px;
      width: 110px;
      height: 42px;
      border: 4px solid var(--hard-line);
      border-radius: 18px;
      background: #f8f2e3;
    }

    .blanket .quilt {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      border: 4px solid var(--hard-line);
      border-radius: 22px 22px 12px 12px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.25) 0 18%, transparent 19% 100%),
        #9bc7e5;
      box-shadow: inset -10px -8px 0 rgba(0,0,0,.08);
    }

    .friend {
      position: absolute;
      bottom: 60px;
      width: 108px;
      max-height: 148px;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      z-index: 6;
      filter: drop-shadow(0 10px 12px rgba(52, 39, 28, .18));
      transition: opacity .22s ease, transform .22s ease;
    }

    .friend.xiuzhen {
      left: 20px;
      transform: translateX(-24px) rotate(-4deg);
    }

    .friend.xiaohe {
      right: 8px;
      bottom: 86px;
      width: 150px;
      transform: translateX(34px) rotate(8deg);
      z-index: 8;
    }

    .friend.show {
      opacity: 1;
      transform: translateX(0) rotate(0deg);
    }

    .friend.xiaohe.show {
      animation: xiaoheSwoop 1.25s ease both;
    }

    .scene-card {
      position: absolute;
      left: 50%;
      top: 54px;
      width: min(82%, 340px);
      min-height: 118px;
      max-height: 238px;
      padding: 10px 10px 8px;
      display: grid;
      place-items: center;
      gap: 6px;
      border: 1px solid rgba(36,31,27,.13);
      border-radius: 12px;
      background: rgba(255, 252, 244, .92);
      box-shadow: 0 18px 42px rgba(45, 32, 24, .18);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -8px) scale(.96);
      transition: opacity .2s ease, transform .2s ease;
      z-index: 11;
    }

    .scene-card.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .scene-card img {
      max-width: 100%;
      max-height: 176px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 10px rgba(42, 30, 22, .14));
    }

    .scene-card span {
      max-width: 100%;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.theme-night .scene-card {
      background: rgba(30, 32, 45, .94);
      border-color: rgba(255, 242, 221, .16);
    }

    body.theme-night .scene-card span {
      color: rgba(251, 242, 229, .74);
    }

    .stage.has-scene .pet {
      opacity: .38;
    }

    .pet {
      left: 50%;
      bottom: 64px;
      width: min(33vw, 158px);
      max-width: 158px;
      min-width: 108px;
      aspect-ratio: 190 / 437;
      z-index: 7;
      touch-action: none;
      user-select: none;
      transform: translate(calc(-50% + var(--tx, 0px)), var(--ty, 0px)) rotate(var(--rot, 0deg));
      transform-origin: 50% 76%;
      transition: transform .42s cubic-bezier(.2,.9,.2,1.15), filter .22s ease;
      filter: drop-shadow(0 18px 16px rgba(47, 34, 24, .17));
    }

    .pet.is-dragging {
      transition: none;
      filter: drop-shadow(0 24px 20px rgba(47, 34, 24, .2));
      cursor: grabbing;
    }

    .pet.is-tired {
      filter: saturate(.82) drop-shadow(0 18px 16px rgba(47, 34, 24, .17));
    }

    .pet-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      transform-origin: 50% 74%;
      animation: originalIdle 3.8s ease-in-out infinite;
    }

    .pet.is-dragging .pet-img {
      animation: originalLift .9s ease-in-out infinite alternate;
      transform-origin: 50% 16%;
    }

    .pet.is-patted .pet-img {
      animation: originalPat .55s ease;
    }

    .pet.is-poked .pet-img {
      animation: originalPoke .42s ease;
    }

    .pet.is-feet .pet-img {
      animation: originalKick .44s ease;
    }

    .pet.is-shaken .pet-img {
      animation: shakeOut .55s ease;
    }

    .pet.act-work .pet-img,
    .pet.act-bag .pet-img,
    .pet.act-xiaohe .pet-img {
      animation: originalNervous .18s linear infinite alternate;
    }

    .pet.act-blanket .pet-img {
      animation: originalSleep 1.5s ease-in-out infinite;
      opacity: .75;
    }

    .tanaka-rig {
      width: 100%;
      height: 100%;
      overflow: visible;
      transform-origin: 50% 72%;
      animation: idleSway 3.8s ease-in-out infinite;
    }

    .pet.is-dragging .tanaka-rig,
    .pet.act-work .tanaka-rig,
    .pet.act-bag .tanaka-rig,
    .pet.act-blanket .tanaka-rig,
    .pet.act-xiaohe .tanaka-rig {
      animation: none;
    }

    .leaf,
    .arm,
    .leg,
    .body-core,
    .face {
      transform-box: fill-box;
      transition: transform .2s ease;
    }

    .leaf {
      transform-origin: 50% 100%;
      animation: leafIdle 3.2s ease-in-out infinite;
    }

    .body-core {
      transform-origin: 50% 66%;
    }

    .arm-left { transform-origin: 100% 0%; transform: rotate(var(--arm-left, -4deg)); }
    .arm-right { transform-origin: 0% 0%; transform: rotate(var(--arm-right, 4deg)); }
    .leg-left { transform-origin: 50% 0%; transform: rotate(var(--leg-left, 0deg)); }
    .leg-right { transform-origin: 50% 0%; transform: rotate(var(--leg-right, 0deg)); }

    .pet.is-dragging .arm-left { transform: rotate(var(--grab-left, -78deg)); }
    .pet.is-dragging .arm-right { transform: rotate(var(--grab-right, 78deg)); }
    .pet.is-dragging .leg-left { transform: rotate(-18deg); }
    .pet.is-dragging .leg-right { transform: rotate(18deg); }

    .pet.is-patted .leaf { animation: leafPat .55s ease; }
    .pet.is-patted .body-core { animation: tinySquash .55s ease; }
    .pet.is-poked .body-core { animation: pokeSquish .42s ease; }
    .pet.is-feet .leg-left { animation: kickLeft .44s ease; }
    .pet.is-feet .leg-right { animation: kickRight .44s ease; }
    .pet.is-shaken .tanaka-rig { animation: shakeOut .55s ease; }

    .pet.act-work .arm-left,
    .pet.act-work .arm-right {
      animation: typing .18s linear infinite alternate;
    }

    .pet.act-work .body-core {
      transform: translateY(6px) rotate(-2deg);
    }

    .pet.act-bag .tanaka-rig {
      animation: bagEscape 1.2s ease-in-out both;
    }

    .pet.act-blanket .tanaka-rig {
      transform: translateY(42px) scale(.88);
      opacity: .88;
    }

    .pet.act-blanket .leaf {
      animation: sleepyLeaf 1.4s ease-in-out infinite;
    }

    .pet.act-xiaohe .tanaka-rig {
      animation: carriedTanaka 1.25s ease both;
    }

    .face [data-mouth],
    .face [data-eye],
    .face .sleep-mark {
      display: none;
    }

    .pet[data-face="sad"] [data-mouth="sad"],
    .pet[data-face="sad"] [data-eye="sad"],
    .pet[data-face="flat"] [data-mouth="flat"],
    .pet[data-face="flat"] [data-eye="flat"],
    .pet[data-face="soft"] [data-mouth="soft"],
    .pet[data-face="soft"] [data-eye="soft"],
    .pet[data-face="shock"] [data-mouth="shock"],
    .pet[data-face="shock"] [data-eye="shock"],
    .pet[data-face="sleep"] [data-mouth="sleep"],
    .pet[data-face="sleep"] [data-eye="sleep"],
    .pet[data-face="sleep"] .sleep-mark {
      display: block;
    }

    .pet.is-rainy .body-fill {
      fill: #df7835;
    }

    .pet.is-night .body-core {
      transform: translateY(5px);
    }

    .speech {
      left: 16px;
      right: 16px;
      bottom: 12px;
      z-index: 10;
      min-height: 46px;
      border: 1px solid rgba(36, 31, 27, .15);
      border-radius: 12px;
      background: rgba(255, 252, 244, .9);
      padding: 10px 12px;
      display: grid;
      align-items: center;
      line-height: 1.35;
      font-size: 14px;
      box-shadow: 0 10px 28px rgba(58, 43, 30, .12);
      pointer-events: none;
    }

    body.theme-night .speech {
      background: rgba(29, 31, 43, .84);
      border-color: rgba(255, 242, 221, .16);
    }

    .mini-layer {
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }

    .float-bit {
      position: absolute;
      min-width: 46px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 3px solid var(--hard-line);
      border-radius: 999px;
      background: #fff6d8;
      box-shadow: 0 9px 14px rgba(48, 34, 25, .14);
      font-size: 13px;
      font-weight: 800;
      pointer-events: auto;
      animation: floatBit 2.2s ease-in-out infinite;
    }

    .float-bit.bad {
      background: #ffd6d0;
    }

    .float-bit.good {
      background: #dcf3e5;
    }

    .float-bit.pop {
      animation: bitPop .28s ease forwards;
      pointer-events: none;
    }

    .panel {
      margin-top: 10px;
      border: 1px solid rgba(36, 31, 27, .13);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 12px 34px rgba(68, 49, 34, .1);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px;
    }

    .stat {
      min-width: 0;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .stat-label {
      color: var(--muted);
    }

    .stat-value {
      font-weight: 800;
    }

    .bar {
      height: 9px;
      border-radius: 999px;
      background: rgba(36,31,27,.09);
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: calc(var(--v, 50) * 1%);
      border-radius: inherit;
      background: var(--c, var(--mint));
      transition: width .28s ease;
    }

    .meters-line {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      border-top: 1px dashed rgba(36,31,27,.14);
      padding-top: 10px;
      font-size: 13px;
    }

    .coin-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(36,31,27,.14);
      background: rgba(255,255,255,.58);
      border-radius: 999px;
      padding: 6px 9px;
      font-weight: 800;
    }

    .coin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #9d7023;
      background: var(--yellow);
      box-shadow: inset -2px -2px 0 rgba(0,0,0,.12);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
      overflow: hidden;
    }

    .action-btn {
      min-width: 0;
      width: 100%;
      min-height: 54px;
      border-radius: 10px;
      border: 1px solid rgba(36,31,27,.16);
      background: #fffaf0;
      box-shadow: 0 8px 16px rgba(50,35,24,.08);
      display: grid;
      grid-template-rows: auto auto;
      justify-items: center;
      align-content: center;
      gap: 3px;
      text-align: center;
      font-weight: 800;
      line-height: 1.1;
    }

    .action-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(50,35,24,.08);
    }

    body.theme-night .action-btn {
      background: rgba(255, 247, 226, .12);
      border-color: rgba(255, 242, 221, .15);
    }

    .action-btn small {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    body.theme-night .action-btn small {
      color: rgba(251, 242, 229, .7);
    }

    .value-panel {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .value-title {
      font-weight: 900;
      margin-bottom: 4px;
    }

    .value-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .drawer {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(calc(100% - 24px), 520px);
      max-height: min(78svh, 610px);
      border: 1px solid rgba(36,31,27,.16);
      border-radius: 16px;
      background: rgba(255, 252, 244, .98);
      box-shadow: 0 20px 70px rgba(25, 18, 12, .28);
      transform: translate(-50%, calc(100% + 22px));
      opacity: 0;
      pointer-events: none;
      transition: transform .24s ease, opacity .24s ease;
      z-index: 30;
      overflow: hidden;
    }

    .drawer.open {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    body.theme-night .drawer {
      background: rgba(29, 31, 43, .98);
      border-color: rgba(255, 242, 221, .16);
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border-bottom: 1px solid rgba(36,31,27,.11);
    }

    .drawer-head strong {
      font-size: 16px;
    }

    .sticker-grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      overflow-y: auto;
      max-height: 460px;
    }

    .sticker {
      min-height: 126px;
      border: 1px solid rgba(36,31,27,.13);
      border-radius: 10px;
      background: rgba(255,255,255,.56);
      display: grid;
      gap: 6px;
      place-items: center;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .sticker.locked {
      filter: grayscale(1);
      opacity: .46;
    }

    .sticker img {
      width: 100%;
      height: 80px;
      object-fit: contain;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: max(14px, env(safe-area-inset-top));
      max-width: min(88vw, 420px);
      transform: translate(-50%, -18px);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      border: 1px solid rgba(36,31,27,.16);
      border-radius: 999px;
      background: rgba(255, 252, 244, .96);
      box-shadow: 0 14px 38px rgba(35, 24, 17, .18);
      padding: 9px 13px;
      font-weight: 900;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.theme-night .toast {
      background: rgba(29, 31, 43, .96);
      border-color: rgba(255, 242, 221, .16);
    }

    @media (max-width: 560px) {
      :root { --stage-h: clamp(340px, 50svh, 470px); }

      .app { padding-left: 10px; padding-right: 10px; }
      h1 { font-size: clamp(20px, 5.6vw, 28px); }
      .stage-shell { border-radius: 12px; }
      .stats { grid-template-columns: 1fr; }
      .actions {
        grid-template-columns: repeat(2, calc((100% - 8px) / 2));
        gap: 8px;
      }
      .action-btn {
        min-height: 52px;
        padding: 0 4px;
        font-size: 15px;
      }
      .meters-line { grid-column: 1; }
      .friend { width: 88px; }
      .friend.xiaohe { width: 122px; right: -2px; }
      .desk { right: 12px; width: 132px; transform-origin: 100% 100%; }
      .market-bag { left: 10px; transform-origin: 0 100%; }
      .speech { left: 10px; right: 10px; font-size: 13px; }
      .sticker-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @keyframes cloudFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 18px 0; }
    }

    @keyframes rainDrop {
      to { transform: translateY(calc(var(--stage-h) + 70px)) translateX(-22px); }
    }

    @keyframes snowFall {
      to { transform: translateY(calc(var(--stage-h) + 40px)) translateX(22px); }
    }

    @keyframes fogSlide {
      from { transform: translateX(-18px); }
      to { transform: translateX(22px); }
    }

    @keyframes idleSway {
      0%, 100% { transform: rotate(-1.2deg) translateY(0); }
      50% { transform: rotate(1.2deg) translateY(-4px); }
    }

    @keyframes originalIdle {
      0%, 100% { transform: translateY(0) rotate(-.8deg); }
      50% { transform: translateY(-4px) rotate(.8deg); }
    }

    @keyframes originalLift {
      from { transform: rotate(-3deg) scale(1.02); }
      to { transform: rotate(3deg) scale(1.04); }
    }

    @keyframes originalPat {
      0%, 100% { transform: translateY(0) scale(1); }
      38% { transform: translateY(5px) scale(1.06, .95); }
      70% { transform: translateY(-2px) scale(.98, 1.03); }
    }

    @keyframes originalPoke {
      0%, 100% { transform: translateX(0) scale(1); }
      34% { transform: translateX(8px) scale(.92, 1.04); }
      68% { transform: translateX(-5px) scale(1.04, .96); }
    }

    @keyframes originalKick {
      0%, 100% { transform: translateY(0) rotate(0); }
      45% { transform: translateY(-8px) rotate(-4deg); }
      72% { transform: translateY(3px) rotate(3deg); }
    }

    @keyframes originalNervous {
      from { transform: translateX(-2px) rotate(-1deg); }
      to { transform: translateX(2px) rotate(1deg); }
    }

    @keyframes originalSleep {
      0%, 100% { transform: translateY(6px) rotate(-2deg) scale(.98); }
      50% { transform: translateY(10px) rotate(1deg) scale(.96); }
    }

    @keyframes leafIdle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes leafPat {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-18deg) scale(1.05); }
      58% { transform: rotate(14deg) scale(.96); }
    }

    @keyframes tinySquash {
      0%, 100% { transform: scale(1); }
      38% { transform: scale(1.04, .96); }
      70% { transform: scale(.98, 1.03); }
    }

    @keyframes pokeSquish {
      0%, 100% { transform: translateX(0) scale(1); }
      35% { transform: translateX(7px) scale(.93, 1.04); }
      70% { transform: translateX(-4px) scale(1.03, .97); }
    }

    @keyframes kickLeft {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-33deg) translateY(-5px); }
    }

    @keyframes kickRight {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(33deg) translateY(-5px); }
    }

    @keyframes shakeOut {
      0%, 100% { transform: translateX(0) rotate(0); }
      18% { transform: translateX(-13px) rotate(-7deg); }
      38% { transform: translateX(13px) rotate(7deg); }
      58% { transform: translateX(-8px) rotate(-4deg); }
      78% { transform: translateX(6px) rotate(3deg); }
    }

    @keyframes typing {
      from { transform: rotate(-28deg); }
      to { transform: rotate(18deg); }
    }

    @keyframes bagEscape {
      0% { transform: translate(0,0) rotate(0); }
      32% { transform: translate(-58px, -38px) rotate(-11deg) scale(.92); }
      58% { transform: translate(-78px, 26px) rotate(9deg) scale(.72); }
      82% { transform: translate(8px, -18px) rotate(-6deg) scale(1.04); }
      100% { transform: translate(0,0) rotate(0) scale(1); }
    }

    @keyframes sleepyLeaf {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(2deg) translateY(3px); }
    }

    @keyframes carriedTanaka {
      0% { transform: translate(0, 0) rotate(0); }
      35% { transform: translate(78px, -68px) rotate(18deg) scale(.9); }
      68% { transform: translate(42px, -96px) rotate(-9deg) scale(.86); }
      100% { transform: translate(0, 0) rotate(0) scale(1); }
    }

    @keyframes xiaoheSwoop {
      0% { opacity: 0; transform: translate(80px, -30px) rotate(9deg); }
      22% { opacity: 1; }
      64% { opacity: 1; transform: translate(-70px, -10px) rotate(-3deg); }
      100% { opacity: 0; transform: translate(-150px, 12px) rotate(-8deg); }
    }

    @keyframes floatBit {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    @keyframes bitPop {
      to { transform: scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>田中电子宠物</h1>
        <div class="subline">
          <span id="clockLabel">读取时间中</span>
          <span id="weatherLabel">本地天气</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="声音">声</button>
        <button class="icon-btn" id="weatherBtn" type="button" aria-label="同步天气">天</button>
      </div>
    </header>

    <section class="stage-shell" aria-label="田中的房间">
      <div class="stage" id="stage" data-weather="sunny">
        <div class="celestial" aria-hidden="true">
          <div class="sun"></div>
          <div class="moon"></div>
          <div class="cloud one"></div>
          <div class="cloud two"></div>
          <div class="cloud three"></div>
        </div>
        <div class="weather-layer rain-layer" id="rainLayer" aria-hidden="true"></div>
        <div class="weather-layer snow-layer" id="snowLayer" aria-hidden="true"></div>
        <div class="weather-layer fog-layer" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>

        <div class="prop desk" id="deskProp" aria-hidden="true">
          <div class="monitor"></div>
          <div class="keyboard"></div>
          <div class="table"></div>
        </div>
        <div class="prop market-bag" id="bagProp" aria-hidden="true">
          <div class="bag"></div>
          <div class="label"></div>
        </div>
        <div class="prop blanket" id="blanketProp" aria-hidden="true">
          <div class="pillow"></div>
          <div class="quilt"></div>
        </div>

        <img class="friend xiuzhen" id="xiuzhen" src="assets/xiuzhen.webp" alt="秀珍" loading="lazy">
        <img class="friend xiaohe" id="xiaohe" src="assets/xiaohe.webp" alt="小河" loading="lazy">

        <div class="scene-card" id="sceneCard" aria-hidden="true">
          <img id="sceneImage" src="assets/tanaka-xiaohe-bite.webp" alt="">
          <span id="sceneCaption">小河叼田中</span>
        </div>

        <div class="pet" id="pet" data-face="sad" role="button" aria-label="摸摸、戳戳或拎起田中" tabindex="0">
          <img class="pet-img" id="petImage" src="assets/tanaka-stand.webp" alt="张田中">
        </div>

        <div class="mini-layer" id="miniLayer" aria-hidden="true"></div>
        <div class="speech" id="bubble">今天先不燃起来，能站着已经算营业了。</div>
      </div>
    </section>

    <section class="panel stats" aria-label="状态">
      <div class="stat">
        <div class="stat-row"><span class="stat-label">丧气</span><span class="stat-value" id="gloomText">58</span></div>
        <div class="bar"><i id="gloomBar" style="--c:#e37b74"></i></div>
      </div>
      <div class="stat">
        <div class="stat-row"><span class="stat-label">体力</span><span class="stat-value" id="energyText">62</span></div>
        <div class="bar"><i id="energyBar" style="--c:#7ba9d8"></i></div>
      </div>
      <div class="stat">
        <div class="stat-row"><span class="stat-label">亲密</span><span class="stat-value" id="bondText">32</span></div>
        <div class="bar"><i id="bondBar" style="--c:#79c7b4"></i></div>
      </div>
      <div class="stat">
        <div class="stat-row"><span class="stat-label">活性</span><span class="stat-value" id="livelyText">42</span></div>
        <div class="bar"><i id="livelyBar" style="--c:#f4c85b"></i></div>
      </div>
      <div class="meters-line">
        <span class="coin-pill"><i class="coin-dot"></i><span id="coinText">8</span> 萝卜币</span>
        <span id="rewardText">奖励 1/9</span>
      </div>
    </section>

    <section class="panel actions" aria-label="动作">
      <button class="action-btn" type="button" data-action="water">热水<small>2币</small></button>
      <button class="action-btn" type="button" data-action="work">去工位<small>赚币</small></button>
      <button class="action-btn" type="button" data-action="bag">超市袋<small>逃生</small></button>
      <button class="action-btn" type="button" data-action="xiuzhen">叫秀珍<small>安慰</small></button>
      <button class="action-btn" type="button" data-action="xiaohe">小河叼走<small>发疯</small></button>
      <button class="action-btn" type="button" data-action="sleep">被窝<small>4币</small></button>
      <button class="action-btn" type="button" data-action="mini">清理无聊<small id="miniSmall">小游戏</small></button>
      <button class="action-btn" type="button" data-action="stickers">表情抽屉<small>收藏</small></button>
    </section>

    <section class="panel value-panel" aria-label="今日小事">
      <div>
        <div class="value-title">今日现实补给</div>
        <div class="value-note" id="realTask">把明天要带的东西放到门口，田中给你记一枚币。</div>
      </div>
      <button class="small-btn" id="realDone" type="button">完成</button>
    </section>
  </main>

  <section class="drawer" id="drawer" aria-label="表情抽屉" aria-hidden="true">
    <div class="drawer-head">
      <strong>表情抽屉</strong>
      <button class="small-btn" id="closeDrawer" type="button">收起</button>
    </div>
    <div class="sticker-grid" id="stickerGrid"></div>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const clamp = (value, min = 0, max = 100) => Math.max(min, Math.min(max, value));
    const storeKey = "tanaka-pet-state-v9";
    const stickers = [
      { id: "idle", name: "丧气待机", img: "assets/tanaka-stand.webp" },
      { id: "flat", name: "扁成萝卜饼", img: "assets/tanaka-flat.webp" },
      { id: "work", name: "工位续命", img: "assets/tanaka-work.webp" },
      { id: "dead", name: "今日已下线", img: "assets/tanaka-dead.webp" },
      { id: "phone", name: "手机防御", img: "assets/tanaka-phone.webp" },
      { id: "smile", name: "稀有微笑", img: "assets/tanaka-smile.webp" },
      { id: "box", name: "盒装田中", img: "assets/tanaka-box.webp" },
      { id: "tv", name: "田中被采访", img: "assets/tanaka-tv.webp" },
      { id: "laptop", name: "电脑上班", img: "assets/tanaka-laptop.webp" },
      { id: "shirt", name: "工牌田中", img: "assets/tanaka-shirt.webp" },
      { id: "paint", name: "精神画画", img: "assets/tanaka-paint.webp" },
      { id: "xiuzhenFan", name: "秀珍陪田中", img: "assets/tanaka-xiuzhen-fan.webp" },
      { id: "friends", name: "四荤一素小盘", img: "assets/tanaka-with-friends.webp" },
      { id: "xiaoheBite", name: "小河叼田中", img: "assets/tanaka-xiaohe-bite.webp" },
      { id: "xiaoheSign", name: "小河举牌", img: "assets/xiaohe-sign.webp" },
      { id: "xiuzhen", name: "秀珍夸夸", img: "assets/xiuzhen.webp" },
      { id: "xiuzhenCry", name: "秀珍委屈", img: "assets/xiuzhen-cry.webp" },
      { id: "xiuzhenCarrot", name: "萝卜帽秀珍", img: "assets/xiuzhen-carrot.webp" },
      { id: "xiaohe", name: "小河叼走", img: "assets/xiaohe.webp" },
      { id: "comicWork", name: "工作没做好", img: "assets/lipu-comic-work.webp" },
      { id: "comicComfort", name: "必要时我会去世", img: "assets/lipu-comic-comfort.webp" },
      { id: "meme", name: "四荤一素", img: "assets/meme-xiuzhen.webp" }
    ];

    const lines = {
      pat: [
        "摸头有效，但田中坚持说这只是叶子养护。",
        "被顺毛了，丧气短暂离线。",
        "田中没有笑，只是嘴角被生活绊了一下。"
      ],
      poke: [
        "戳到了。田中表示：这也算上班吗？",
        "田中往旁边缩了一点，但没有真的生气。",
        "这一戳很现实，丧气值也现实地掉了一点。"
      ],
      feet: [
        "短腿踢了两下，活动量达标。",
        "田中试图逃离地球，但腿长不同意。",
        "小短腿营业，奖励一枚心理萝卜。"
      ],
      lift: [
        "被拎起来了，双臂进入求生模式。",
        "田中悬空思考人生，结论是先放下。",
        "拎起成功，田中被迫精神抖擞一秒。"
      ],
      drop: [
        "落地。田中假装什么都没发生。",
        "放下来了，丧气恢复站姿。",
        "田中重新连接地面，信号一般。"
      ],
      rain: [
        "下雨天田中会更蔫，热水效果翻倍一点。",
        "雨声适合发呆，也适合把自己放回被窝。"
      ],
      night: [
        "夜晚模式：田中建议少想点，先回血。",
        "月亮上线，田中进入低功耗丧气。"
      ]
    };

    const realTasks = [
      "把明天要带的东西放到门口，田中给你记一枚币。",
      "喝一杯水，不用立刻变好，田中先给你加体力。",
      "把今天最烦的一件事写成五个字，然后关掉。",
      "洗一个杯子就算赢，别把夜晚交给内耗。",
      "躺下前把充电器插好，明早少骂世界一次。"
    ];

    const defaultState = {
      gloom: 58,
      energy: 62,
      bond: 32,
      lively: 42,
      coins: 8,
      unlocked: ["idle", "box", "laptop", "xiuzhenFan", "xiaoheBite", "comicWork"],
      completedTasks: {},
      weather: { kind: "sunny", label: "本地晴", temp: null, updatedAt: 0 },
      sound: false,
      lastTick: Date.now()
    };

    const state = loadState();
    const pet = $("#pet");
    const petImage = $("#petImage");
    const stage = $("#stage");
    const bubble = $("#bubble");
    const sceneCard = $("#sceneCard");
    const sceneImage = $("#sceneImage");
    const sceneCaption = $("#sceneCaption");
    const rainLayer = $("#rainLayer");
    const snowLayer = $("#snowLayer");
    const miniLayer = $("#miniLayer");
    const drawer = $("#drawer");
    const toast = $("#toast");
    let audioCtx = null;
    let toastTimer = 0;
    let actionTimer = 0;
    let sceneTimer = 0;
    let mini = null;
    let drag = null;

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storeKey));
        if (!parsed) return structuredClone(defaultState);
        return {
          ...structuredClone(defaultState),
          ...parsed,
          weather: { ...defaultState.weather, ...(parsed.weather || {}) },
          unlocked: Array.isArray(parsed.unlocked) ? parsed.unlocked : ["idle"],
          completedTasks: parsed.completedTasks || {}
        };
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      state.lastTick = Date.now();
      localStorage.setItem(storeKey, JSON.stringify(state));
    }

    function randomLine(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function say(text) {
      bubble.textContent = text;
    }

    function showToast(text) {
      clearTimeout(toastTimer);
      toast.textContent = text;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);

    function spendCoins(amount) {
      if (state.coins < amount) {
        say("萝卜币不够，田中把钱包翻出来给你看，里面是空气。");
        playSound("deny");
        pulse("is-poked", 420);
        return false;
      }
      state.coins -= amount;
      return true;
    }

    function change(delta) {
      state.gloom = clamp(state.gloom + (delta.gloom || 0));
      state.energy = clamp(state.energy + (delta.energy || 0));
      state.bond = clamp(state.bond + (delta.bond || 0));
      state.lively = clamp(state.lively + (delta.lively || 0));
      state.coins = Math.max(0, Math.min(999, state.coins + (delta.coins || 0)));
      render();
      saveState();
    }

    function unlock(id) {
      if (state.unlocked.includes(id)) return false;
      state.unlocked.push(id);
      showToast("解锁：" + stickers.find((item) => item.id === id).name);
      renderStickers();
      saveState();
      return true;

    function pulse(className, duration = 520) {
      pet.classList.remove(className);
      void pet.offsetWidth;
      pet.classList.add(className);
      setTimeout(() => pet.classList.remove(className), duration);
    }

    function playAction(className, duration = 1200) {
      clearTimeout(actionTimer);
      pet.classList.remove("act-work", "act-bag", "act-blanket", "act-xiaohe");
      pet.classList.add(className);
      actionTimer = setTimeout(() => pet.classList.remove(className), duration);

    function showProp(element, duration = 1400) {
      element.classList.add("show");
      setTimeout(() => element.classList.remove("show"), duration);
    }

    function showFriend(element, duration = 1400) {

    function showScene(src, caption, duration = 1900) {

      sceneImage.src = src;
      sceneImage.alt = caption;
      sceneCaption.textContent = caption;
      sceneCard.classList.add("show");

    function setFace(face) {
      pet.dataset.face = face;
    }

    function currentPhase(date = new Date()) {
      const hour = date.getHours();
      if (hour >= 5 && hour < 10) return "morning";
      if (hour >= 10 && hour < 17) return "day";
      if (hour >= 17 && hour < 21) return "evening";
      return "night";
    }

    function phaseName(phase) {
      return { morning: "早晨", day: "白天", evening: "傍晚", night: "夜晚" }[phase] || "白天";
    }

    function render() {
      const phase = currentPhase();
      document.body.classList.remove("theme-morning", "theme-day", "theme-evening", "theme-night");
      document.body.classList.add("theme-" + phase);
      stage.dataset.weather = state.weather.kind;
      pet.classList.toggle("is-rainy", state.weather.kind === "rain");
      pet.classList.toggle("is-night", phase === "night");
      pet.classList.toggle("is-tired", state.energy < 28);

      let face = "sad";
      if (state.energy < 18 || phase === "night" && state.energy < 38) face = "sleep";
      else if (state.gloom > 72) face = "flat";
      else if (state.bond > 70 && state.gloom < 45) face = "soft";
      pet.dataset.face = face;

      setBar("gloom", state.gloom);
      setBar("energy", state.energy);
      setBar("bond", state.bond);
      setBar("lively", state.lively);
      $("#coinText").textContent = Math.round(state.coins);
      $("#rewardText").textContent = "奖励 " + state.unlocked.length + "/" + stickers.length;
      $("#soundBtn").textContent = state.sound ? "静" : "声";
      $("#weatherLabel").textContent = weatherText();
      updateClock();
    }

    function setBar(name, value) {
      $("#" + name + "Text").textContent = Math.round(value);
      $("#" + name + "Bar").style.setProperty("--v", value);
    }

    function weatherText() {
      const temp = state.weather.temp === null ? "" : " " + Math.round(state.weather.temp) + "℃";
      return state.weather.label + temp;
    }

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
      $("#clockLabel").textContent = phaseName(currentPhase(now)) + " " + time;
    }

    function setupWeatherParticles() {
      rainLayer.innerHTML = "";
      snowLayer.innerHTML = "";
      for (let i = 0; i < 42; i++) {
        const drop = document.createElement("i");
        drop.className = "drop";

        drop.style.animationDuration = 0.55 + Math.random() * 0.55 + "s";
        drop.style.animationDelay = -Math.random() * 1.8 + "s";
        drop.style.opacity = 0.36 + Math.random() * 0.42;
        rainLayer.appendChild(drop);
      }
      for (let i = 0; i < 34; i++) {

        flake.className = "flake";

        flake.style.animationDuration = 3.8 + Math.random() * 3.2 + "s";

        flake.style.opacity = 0.42 + Math.random() * 0.5;
        snowLayer.appendChild(flake);

    function weatherFromCode(code) {
      if ([0, 1].includes(code)) return { kind: "sunny", label: "晴" };
      if ([2, 3].includes(code)) return { kind: "cloudy", label: "多云" };
      if ([45, 48].includes(code)) return { kind: "fog", label: "雾" };
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95 && code <= 99)) return { kind: "rain", label: "雨" };
      if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return { kind: "snow", label: "雪" };
      return { kind: "cloudy", label: "多云" };
    }

    function fallbackWeather() {
      if (state.weather.updatedAt && Date.now() - state.weather.updatedAt < 1000 * 60 * 60 * 4) return;
      const hour = new Date().getHours();
      const map = ["sunny", "cloudy", "sunny", "rain", "fog"];
      const kind = map[new Date().getDate() % map.length];
      state.weather = {
        kind,
        label: kind === "sunny" ? "本地晴" : kind === "cloudy" ? "本地多云" : kind === "rain" ? "本地雨" : "本地雾",
        temp: hour >= 6 && hour <= 18 ? 24 : 20,
        updatedAt: Date.now()
      };
    }

    async function syncWeather() {
      if (!navigator.geolocation) {
        say("这个浏览器拿不到位置，先用本地天气陪田中营业。");
        return;
      }
      $("#weatherBtn").disabled = true;
      $("#weatherBtn").textContent = "等";
      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 8000, maximumAge: 1000 * 60 * 30 });
        });
        const { latitude, longitude } = position.coords;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,is_day&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("weather failed");
        const data = await res.json();
        const mapped = weatherFromCode(data.current.weather_code);
        state.weather = {
          kind: mapped.kind,
          label: "实时" + mapped.label,
          temp: data.current.temperature_2m,
          updatedAt: Date.now()
        };
        say("天气同步好了，田中开始按现实世界的天色营业。");
        change({ gloom: mapped.kind === "rain" ? 1 : -1, lively: mapped.kind === "sunny" ? 2 : 0 });
      } catch {
        say("天气同步失败，先让田中用本地天气顶班。");
      } finally {
        $("#weatherBtn").disabled = false;
        $("#weatherBtn").textContent = "天";
        render();
      }
    }

    function applyOfflineTime() {
      const elapsed = Math.min(Date.now() - (state.lastTick || Date.now()), 1000 * 60 * 60 * 10);
      const halfHours = Math.floor(elapsed / (1000 * 60 * 30));
      if (halfHours <= 0) return;
      const phase = currentPhase();
      change({
        gloom: halfHours * (phase === "night" ? -0.6 : 0.9),
        energy: halfHours * (phase === "night" ? 1.2 : -0.7),
        lively: halfHours * -0.4
      });
    }

    function timeTick() {
      const phase = currentPhase();
      const weather = state.weather.kind;
      const delta = {
        gloom: phase === "night" ? -0.08 : phase === "day" ? 0.14 : 0.04,
        energy: phase === "night" ? 0.15 : -0.08,
        lively: phase === "day" ? -0.03 : 0.04
      };
      if (weather === "rain") delta.gloom += 0.08;
      if (weather === "sunny") delta.lively += 0.07;
      if (weather === "fog") delta.energy -= 0.04;
      change(delta);
      if (weather === "rain" && Math.random() < .18) say(randomLine(lines.rain));
      if (phase === "night" && Math.random() < .12) say(randomLine(lines.night));
    }

    function enableSound() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      state.sound = true;
      render();
      saveState();
    }

    function playSound(type) {
      if (!state.sound) return;
      enableSound();
      const patterns = {
        pat: [[520, .05], [740, .07]],
        poke: [[180, .06], [260, .05]],
        coin: [[640, .05], [880, .08], [1180, .08]],
        deny: [[130, .12]],
        drop: [[320, .05], [180, .08]],
        sleep: [[420, .12], [360, .18]],
        swoop: [[260, .05], [520, .09], [330, .08]]
      };
      let t = audioCtx.currentTime;
      (patterns[type] || patterns.pat).forEach(([freq, dur], index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = index % 2 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.11, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + .02);
        t += dur + .025;
      });
    }

    function vibrate(ms = 12) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function petLocalPoint(event) {
      const rect = pet.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) / rect.width,
        y: (event.clientY - rect.top) / rect.height
      };
    }

    function onPetDown(event) {
      enableMaybe();
      pet.setPointerCapture(event.pointerId);
      const rect = pet.getBoundingClientRect();
      const local = petLocalPoint(event);
      drag = {
        id: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        lastX: event.clientX,
        lastY: event.clientY,
        lastTime: performance.now(),
        vx: 0,
        vy: 0,
        moved: false,
        grabSide: local.x < .45 ? "left" : local.x > .55 ? "right" : "both",
        petX: Number.parseFloat(pet.style.getPropertyValue("--tx")) || 0,
        petY: Number.parseFloat(pet.style.getPropertyValue("--ty")) || 0,
        width: rect.width
      };
      pet.classList.add("is-dragging");
      setFace("shock");
      vibrate(10);
    }

    function onPetMove(event) {
      if (!drag || event.pointerId !== drag.id) return;
      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;
      const now = performance.now();
      const dt = Math.max(16, now - drag.lastTime);
      drag.vx = (event.clientX - drag.lastX) / dt;
      drag.vy = (event.clientY - drag.lastY) / dt;
      drag.lastX = event.clientX;
      drag.lastY = event.clientY;
      drag.lastTime = now;
      if (Math.hypot(dx, dy) > 8) drag.moved = true;

      const stageRect = stage.getBoundingClientRect();
      const maxX = stageRect.width * .32;
      const maxUp = -stageRect.height * .42;
      const maxDown = stageRect.height * .1;
      const tx = clamp(drag.petX + dx, -maxX, maxX);
      const ty = clamp(drag.petY + dy, maxUp, maxDown);
      const rot = clamp(dx / stageRect.width * 28, -16, 16);
      pet.style.setProperty("--tx", tx + "px");
      pet.style.setProperty("--ty", ty + "px");
      pet.style.setProperty("--rot", rot + "deg");

      const lift = clamp(-52 - Math.max(0, -dy) * .12, -94, -38);
      if (drag.grabSide === "left") {
        pet.style.setProperty("--grab-left", lift + "deg");
        pet.style.setProperty("--grab-right", "38deg");
      } else if (drag.grabSide === "right") {
        pet.style.setProperty("--grab-left", "-38deg");
        pet.style.setProperty("--grab-right", Math.abs(lift) + "deg");
      } else {
        pet.style.setProperty("--grab-left", lift + "deg");
        pet.style.setProperty("--grab-right", Math.abs(lift) + "deg");
      }

      if (Math.abs(drag.vx) > .95 && Math.random() < .2) {
        pet.classList.add("is-shaken");
        setTimeout(() => pet.classList.remove("is-shaken"), 560);
      }
    }

    function onPetUp(event) {
      if (!drag || event.pointerId !== drag.id) return;
      const local = petLocalPoint(event);
      pet.classList.remove("is-dragging");
      pet.style.setProperty("--tx", "0px");
      pet.style.setProperty("--ty", "0px");
      pet.style.setProperty("--rot", "0deg");
      pet.style.setProperty("--grab-left", "-78deg");
      pet.style.setProperty("--grab-right", "78deg");

      if (!drag.moved) {
        if (local.y < .34) patPet();
        else if (local.y > .78) footPet();
        else pokePet();
      } else {
        const fling = Math.abs(drag.vx) + Math.abs(drag.vy);
        say(randomLine(lines.drop));
        playSound("drop");
        change({ lively: 2, bond: .8, gloom: -.6 });
        if (fling > 1.35) {
          unlock("meme");
          say("田中被你晃出了表情包残影。");
        }
      }
      drag = null;
    }

    function startMiniGame() {
      if (mini) return;

      mini = { score: 0, taps: 0, endsAt: Date.now() + duration, spawner: 0, closer: 0 };

      say("清理无聊开始：直接点掉飘出来的烦人事，捡到萝卜币就算赚。");

      mini.spawner = setInterval(spawnBit, 690);
      mini.closer = setTimeout(endMiniGame, duration);
    }

    function spawnBit() {
      if (!mini) return;
      const options = [
        { label: "无聊", kind: "bad", delta: { gloom: -2, lively: 1 }, score: 1 },
        { label: "加班", kind: "bad", delta: { gloom: 2, energy: -2 }, score: -1 },
        { label: "+币", kind: "good", delta: { coins: 1, lively: 1 }, score: 1 },
        { label: "夸夸", kind: "good", delta: { bond: 2, gloom: -1 }, score: 1 },
        { label: "返工", kind: "bad", delta: { gloom: 3, energy: -1 }, score: -1 },
        { label: "热水", kind: "good", delta: { energy: 2, gloom: -1 }, score: 1 }
      ];
      const item = options[Math.floor(Math.random() * options.length)];
      const bit = document.createElement("button");
      bit.type = "button";
      bit.className = "float-bit " + item.kind;
      bit.textContent = item.label;
      bit.style.left = 8 + Math.random() * 76 + "%";
      bit.style.top = 14 + Math.random() * 54 + "%";
      bit.style.animationDelay = -Math.random() * 1.2 + "s";
      bit.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        bit.classList.add("pop");
        mini.score += item.score;
        mini.taps += 1;
        change(item.delta);
        playSound(item.kind === "good" ? "coin" : "poke");
        setTimeout(() => bit.remove(), 280);
      }, { once: true });
      miniLayer.appendChild(bit);
      setTimeout(() => bit.remove(), 2600);
    }

    function endMiniGame() {
      if (!mini) return;
      clearInterval(mini.spawner);
      clearTimeout(mini.closer);
      const score = mini.score;
      const bonus = Math.max(1, Math.floor(Math.max(0, score) / 2));
      change({ coins: bonus, energy: -5, bond: 2, lively: 5 });
      say("无聊清理结束，田中结算：" + bonus + "枚萝卜币，精神噪音少了一点。");
      if (mini.taps >= 10) unlock("phone");
      if (score >= 8) unlock("meme");
      miniLayer.innerHTML = "";
      miniLayer.setAttribute("aria-hidden", "true");
      $("#miniSmall").textContent = "小游戏";
      mini = null;
    }

    function renderStickers() {
      const grid = $("#stickerGrid");
      grid.innerHTML = "";
      stickers.forEach((item) => {
        const owned = state.unlocked.includes(item.id);
        const card = document.createElement("div");
        card.className = "sticker" + (owned ? "" : " locked");
        const img = document.createElement("img");
        img.src = item.img;
        img.alt = item.name;
        img.loading = "lazy";
        const label = document.createElement("span");
        label.textContent = owned ? item.name : "未解锁";
        card.append(img, label);
        grid.appendChild(card);
      });
    }

    function openDrawer() {
      renderStickers();
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    function setRealTask() {
      const today = new Date().toISOString().slice(0, 10);
      const index = Math.abs(today.split("-").join("") * 1) % realTasks.length;
      $("#realTask").textContent = realTasks[index];
      $("#realDone").disabled = Boolean(state.completedTasks[today]);
      $("#realDone").textContent = state.completedTasks[today] ? "已完成" : "完成";
    }

    function completeRealTask() {
      const today = new Date().toISOString().slice(0, 10);
      if (state.completedTasks[today]) return;
      state.completedTasks[today] = true;
      say("现实补给已打勾。田中承认，这个确实有点用。");
      playSound("coin");
      change({ coins: 3, energy: 4, gloom: -3, bond: 1 });
      setRealTask();
    }

    function wireEvents() {
      pet.addEventListener("pointerdown", onPetDown);
      pet.addEventListener("pointermove", onPetMove);
      pet.addEventListener("pointerup", onPetUp);
      pet.addEventListener("pointercancel", onPetUp);
      pet.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          patPet();
        }
      });

      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          enableMaybe();
          const action = button.dataset.action;
          if (action === "water") actionWater();
          if (action === "work") actionWork();
          if (action === "bag") actionBag();
          if (action === "xiuzhen") actionXiuzhen();
          if (action === "xiaohe") actionXiaohe();
          if (action === "sleep") actionSleep();
          if (action === "mini") startMiniGame();
          if (action === "stickers") openDrawer();
        });
      });

      $("#closeDrawer").addEventListener("click", closeDrawer);
      $("#realDone").addEventListener("click", completeRealTask);
      $("#weatherBtn").addEventListener("click", syncWeather);
      $("#soundBtn").addEventListener("click", () => {
        if (state.sound) {
          state.sound = false;
          saveState();
          render();
          return;
        }
        enableSound();
        playSound("coin");
      });
    }

    function boot() {
      fallbackWeather();
      setupWeatherParticles();
      applyOfflineTime();
      setRealTask();
      wireEvents();
      renderStickers();
      render();
      setInterval(updateClock, 1000 * 20);
      setInterval(timeTick, 1000 * 8);
      window.addEventListener("beforeunload", saveState);
    }

    boot();
  </script>
</body>
</html>
