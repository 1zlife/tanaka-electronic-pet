<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>田中电子宠物</title>
  <link rel="preload" as="image" href="assets/tanaka-stand.webp">
  <link rel="preload" as="image" href="assets/xiuzhen.webp">
  <link rel="preload" as="image" href="assets/xiaohe.webp">
  <style>
    :root {
      color-scheme: light;
      --ink: #221d19;
      --soft: #76645a;
      --paper: #fff9ed;
      --panel: rgba(255, 255, 250, .88);
      --line: #2b241f;
      --orange: #ff8d35;
      --green: #8dcf3f;
      --teal: #72c9c1;
      --rose: #ef7772;
      --blue: #92b9e8;
      --yellow: #f8cf5e;
      --shadow: 0 18px 48px rgba(89, 61, 39, .16);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100svh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255,255,255,.42) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.38) 1px, transparent 1px),
        linear-gradient(150deg, #fff3d7 0%, #ffeadb 42%, #e8f6ee 100%);
      background-size: 28px 28px, 28px 28px, auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body.theme-morning {
      background:
        linear-gradient(90deg, rgba(255,255,255,.44) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px),
        linear-gradient(150deg, #fff0c8 0%, #ffdede 42%, #e8f7ed 100%);
      background-size: 28px 28px, 28px 28px, auto;
    }

    body.theme-day {
      background:
        linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.36) 1px, transparent 1px),
        linear-gradient(150deg, #fff8dd 0%, #eaf4ff 50%, #e8f6ee 100%);
      background-size: 28px 28px, 28px 28px, auto;
    }

    body.theme-evening {
      background:
        linear-gradient(90deg, rgba(255,255,255,.34) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px),
        linear-gradient(150deg, #ffe1b9 0%, #ffd1c4 44%, #d8eef0 100%);
      background-size: 28px 28px, 28px 28px, auto;
    }

    body.theme-night {
      color: #f8efe3;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(150deg, #171a28 0%, #29334b 54%, #26413f 100%);
      background-size: 28px 28px, 28px 28px, auto;
    }

    body.theme-night .eyebrow,
    body.theme-night .panel-title small,
    body.theme-night .stat span { color: #d9cfc2; }

    button { border: 0; font: inherit; cursor: pointer; }

    .app {
      width: min(100%, 462px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: #7a5c4d;
      font-size: 12px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8.2vw, 39px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .sound {
      min-width: 74px;
      height: 42px;
      border-radius: 12px;
      background: #fff;
      color: #5d514a;
      font-size: 13px;
      font-weight: 950;
      box-shadow: 0 8px 20px rgba(85, 60, 42, .12);
    }

    .sound.ready { background: var(--ink); color: #fff; }

    .top-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .stat {
      min-height: 54px;
      border: 2px solid rgba(43, 36, 31, .12);
      border-radius: 10px;
      background: var(--panel);
      padding: 7px 9px;
      box-shadow: 0 8px 20px rgba(82, 54, 35, .07);
    }

    .stat span {
      display: block;
      color: #7f695f;
      font-size: 11px;
      font-weight: 950;
      white-space: nowrap;
    }

    .stat strong {
      display: block;
      margin-top: 1px;
      font-size: 18px;
      font-weight: 1000;
      letter-spacing: 0;
      white-space: nowrap;
    }

    body.theme-night .stat,
    body.theme-night .panel,
    body.theme-night .bubble {
      background: rgba(35, 36, 47, .88);
      border-color: rgba(255, 255, 255, .24);
      color: #fff4e8;
    }

    .need-bars {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin: 0 0 9px;
    }

    .need {
      border-radius: 9px;
      background: #fff;
      padding: 7px;
      font-size: 11px;
      font-weight: 950;
      color: #69564d;
    }

    body.theme-night .need,
    body.theme-night .mission,
    body.theme-night .badge,
    body.theme-night .shop button {
      background: rgba(255, 255, 255, .12);
      color: #fff2e6;
    }

    .need span {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
      white-space: nowrap;
    }

    .meter {
      height: 8px;
      border-radius: 999px;
      background: rgba(43, 36, 31, .12);
      overflow: hidden;
    }

    .meter i {
      display: block;
      width: var(--value, 50%);
      height: 100%;
      border-radius: inherit;
      background: var(--fill, var(--orange));
      transition: width .24s ease;
    }
    }

    .stage {
      position: relative;
      height: clamp(390px, 56svh, 540px);
      min-height: 390px;
      border: 2px solid rgba(43, 36, 31, .16);
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.42), rgba(255, 252, 244, .9)),
        linear-gradient(90deg, transparent 0 32%, rgba(248, 207, 94, .22) 32% 34%, transparent 34% 66%, rgba(248, 207, 94, .22) 66% 68%, transparent 68%);
      box-shadow: var(--shadow);
      overflow: hidden;
      touch-action: none;
      isolation: isolate;
    }

    .stage::after {
      content: "";
      position: absolute;
      left: 64px;
      right: 54px;
      bottom: 68px;
      height: 34px;
      border-radius: 50%;
      background: rgba(98, 65, 42, .2);
      filter: blur(2px);
      z-index: 1;
      pointer-events: none;
    }

    .weather-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .weather-layer span {
      position: absolute;
      opacity: .55;
      pointer-events: none;
    }

    .weather-rain .weather-layer span {
      width: 2px;
      height: 18px;
      border-radius: 999px;
      background: rgba(70, 112, 165, .38);
      animation: rain-fall 1.1s linear infinite;
    }

    .weather-snow .weather-layer span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .9);
      animation: snow-fall 3.2s linear infinite;
    }

    .weather-sunny .weather-layer::before {
      content: "晴";
      position: absolute;
      right: 18px;
      top: 92px;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: #ffe37a;
      color: var(--line);
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 1000;
      box-shadow: 4px 4px 0 rgba(43, 36, 31, .1);
      transform: rotate(8deg);
    }

    .weather-cloudy .weather-layer::before,
    .weather-fog .weather-layer::before {
      content: "阴";
      position: absolute;
      right: 20px;
      top: 96px;
      border: 3px solid var(--line);
      border-radius: 999px;
      background: #d8dde2;
      color: var(--line);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 1000;
      box-shadow: 4px 4px 0 rgba(43, 36, 31, .1);
      transform: rotate(5deg);
    }

    .game-hud {
      position: absolute;
      left: 50%;
      top: 16px;
      z-index: 9;
      min-width: 148px;
      border: 3px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 1000;
      text-align: center;
      transform: translateX(-50%) translateY(-18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .game-hud.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .game-item {
      position: absolute;
      z-index: 4;
      border: 3px solid var(--line);
      border-radius: 11px;
      min-width: 48px;
      min-height: 36px;
      display: grid;
      place-items: center;
      padding: 5px 8px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 1000;
      box-shadow: 4px 4px 0 rgba(43, 36, 31, .1);
      animation: item-pop .2s ease-out both;
      pointer-events: none;
    }

    .game-item.coin { background: #ffe078; }
    .game-item.bad { background: #ffd4d1; }
    .game-item.good { background: #ddf2e2; }

    .zone {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      min-width: 86px;
      min-height: 58px;
      border: 3px solid var(--line);
      border-radius: 12px;
      background: #fffef7;
      color: var(--ink);
      font-size: 13px;
      font-weight: 1000;
      box-shadow: 5px 5px 0 rgba(43, 36, 31, .11);
      transform: rotate(var(--tilt));
      transition: transform .18s ease, background .18s ease;
      pointer-events: none;
    }

    .zone.hot {
      background: #fff1a8;
      transform: rotate(var(--tilt)) scale(1.08);
    }

    .zone.work { left: 16px; top: 18px; --tilt: -4deg; background: #e9f3ff; }
    .zone.xiuzhen { right: 14px; top: 24px; --tilt: 3deg; background: #ffe5e3; }
    .zone.bag { left: 16px; bottom: 30px; --tilt: -7deg; background: #f0d294; min-height: 74px; }
    .zone.bed { right: 16px; bottom: 30px; --tilt: 5deg; background: #dff2eb; min-height: 74px; }

    .zone.bag::before {
      content: "";
      position: absolute;
      top: -22px;
      width: 34px;
      height: 23px;
      border: 4px solid var(--line);
      border-bottom: 0;
      border-radius: 22px 22px 0 0;
    }

    .path-dot {
      position: absolute;
      z-index: 1;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(43, 36, 31, .28);
      pointer-events: none;
    }

    .friend {
      position: absolute;
      z-index: 6;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 12px 10px rgba(61, 44, 32, .16));
    }

    .friend.xiuzhen {
      left: -132px;
      top: 42%;
      width: min(34vw, 142px);
    }

    .friend.xiaohe {
      right: -170px;
      top: 42%;
      width: min(42vw, 176px);
    }

    .friend.xiuzhen.show { animation: xiuzhen-pop 2.45s ease both; }
    .friend.xiaohe.show { animation: xiaohe-pass 1.35s ease-in-out both; }

    .pet {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 5;
      width: min(42vw, 166px);
      height: min(94vw, 380px);
      padding: 0;
      background: transparent;
      translate: -50% -50%;
      touch-action: none;
      user-select: none;
      cursor: grab;
      transition: transform .2s cubic-bezier(.2,.9,.2,1.18), filter .18s ease;
    }

    .pet.pose-stand,
    .pet.pose-smile {
      width: min(42vw, 166px);
      height: min(94vw, 380px);
    }

    .pet.pose-work {
      top: 52%;
      width: min(58vw, 236px);
      height: min(54vw, 220px);
    }

    .pet.pose-dead,
    .pet.pose-flat,
    .pet.pose-phone {
      top: 58%;
      width: min(68vw, 270px);
      height: min(42vw, 168px);
    }

    .pet img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: saturate(1.05) contrast(1.04) drop-shadow(0 12px 11px rgba(80, 48, 30, .2));
      transform-origin: 50% 82%;
      transition: transform .18s ease, filter .18s ease;
    }

    .pet.held {
      cursor: grabbing;
      filter: drop-shadow(0 26px 24px rgba(80, 48, 30, .22));
      transition: none;
    }

    .pet.held img { animation: held-wobble .42s ease-in-out infinite; }
    .pet.pat img { animation: micro-smile .58s ease-in-out 2; }
    .pet.poke img { animation: recoil .32s ease-in-out both; }
    .pet.drop img { animation: squash .36s ease-out both; }
    .pet.baggy img { animation: bag-dive .62s ease-out both; }
    .pet.fly img { animation: abducted .72s ease-in-out both; }
    .pet.sleep img { animation: lie-flat .72s ease-out both; }
    .pet.pose-phone.sleep img,
    .pet.pose-flat.sleep img,
    .pet.pose-dead.sleep img { animation: low-battery 1.8s ease-in-out infinite; }
    .pet.reward img { animation: reluctant-joy .68s ease-in-out both; }
    .pet.shake img { animation: shakeout .44s ease-in-out both; }

    .mood-mark {
      position: absolute;
      left: 50%;
      top: 8px;
      z-index: 8;
      min-width: 42px;
      border: 3px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 4px 9px;
      font-size: 13px;
      font-weight: 1000;
      transform: translateX(-50%) rotate(-4deg);
      box-shadow: 4px 4px 0 rgba(43, 36, 31, .1);
      opacity: 0;
      pointer-events: none;
    }

    .mood-mark.show { animation: mark-pop .9s ease both; }

    .bubble {
      margin: 0;
      min-height: 58px;
      border: 3px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.96);
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.38;
      font-weight: 900;
      box-shadow: 6px 6px 0 rgba(43, 36, 31, .1);
    }

    .sticker {
      position: absolute;
      left: 50%;
      top: 68px;
      z-index: 8;
      width: min(78vw, 258px);
      border: 3px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 10px 12px;
      transform: translateX(-50%) rotate(-3deg);
      box-shadow: 8px 8px 0 rgba(43, 36, 31, .12);
      opacity: 0;
      pointer-events: none;
    }

    .sticker.show { animation: sticker-card 2.15s ease both; }

    .sticker.with-image {
      width: min(82vw, 292px);
    }

    .sticker-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      color: #755a4b;
      font-size: 12px;
      font-weight: 1000;
    }

    .sticker-img {
      display: none;
      width: 100%;
      max-height: 156px;
      object-fit: contain;
      border-radius: 8px;
      background: #fffdf7;
      margin: 3px 0 7px;
    }

    .sticker.with-image .sticker-img {
      display: block;
    }

    .sticker-face {
      width: 27px;
      height: 27px;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: var(--orange);
      flex: 0 0 auto;
      position: relative;
    }

    .sticker-face::before,
    .sticker-face::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 4px;
      height: 4px;
      background: var(--line);
      border-radius: 50%;
    }

    .sticker-face::before { left: 7px; }
    .sticker-face::after { right: 7px; }

    .sticker-text {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
      font-weight: 1000;
    }

    .dock {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .tool {
      min-height: 52px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.12;
      font-weight: 1000;
      box-shadow: 4px 4px 0 rgba(43, 36, 31, .12);
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }

    .tool:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 rgba(43, 36, 31, .16);
    }

    .tool.primary { background: #ffe47f; }

    .panel {
      border: 2px solid rgba(43, 36, 31, .14);
      border-radius: 12px;
      background: var(--panel);
      padding: 10px;
      box-shadow: 0 8px 20px rgba(82, 54, 35, .07);
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 1000;
    }

    .panel-title small {
      color: var(--soft);
      font-size: 11px;
      font-weight: 900;
    }

    .missions {
      display: grid;
      gap: 6px;
    }

    .mission {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      border-radius: 9px;
      background: #fff;
      padding: 7px 9px;
      color: #4f433d;
      font-size: 12px;
      font-weight: 900;
    }

    .mission.done {
      background: #e9f7e7;
      color: #315f39;
    }

    .mission b {
      font-size: 12px;
      white-space: nowrap;
    }

    .book {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 9px;
    }

    .badge {
      min-height: 34px;
      border-radius: 9px;
      background: #f2eadc;
      color: #928174;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 5px 6px;
      font-size: 11px;
      line-height: 1.15;
      font-weight: 950;
    }

    .badge.on {
      background: #211d19;
      color: #fff;
    }

    .coupon {
      display: none;
      margin-top: 9px;
      border: 3px dashed var(--line);
      border-radius: 12px;
      background: #fff6c8;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 950;
      transform: rotate(-1deg);
    }

    .coupon.show {
      display: block;
      animation: coupon-pop .28s ease-out both;
    }

    .world {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin: 8px 0 0;
      border-radius: 9px;
      background: #fff;
      padding: 8px 9px;
      color: #51443e;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 950;
    }

    body.theme-night .world {
      background: rgba(255, 255, 255, .12);
      color: #fff2e6;
    }

    .world button,
    .shop button {
      min-height: 34px;
      border: 2px solid var(--line);
      border-radius: 9px;
      background: #fff8d2;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.1;
      font-weight: 1000;
      box-shadow: 3px 3px 0 rgba(43, 36, 31, .1);
    }

    .world button:active,
    .shop button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 rgba(43, 36, 31, .12);
    }

    .shop {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .shop button {
      min-height: 46px;
      background: #fff;
      padding: 5px;
    }

    .shop button[disabled] {
      opacity: .46;
      transform: none;
      box-shadow: none;
      cursor: default;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: max(12px, env(safe-area-inset-top));
      z-index: 20;
      max-width: min(88vw, 390px);
      border: 3px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px 13px;
      font-size: 14px;
      font-weight: 1000;
      box-shadow: 6px 6px 0 rgba(43, 36, 31, .13);
      transform: translateX(-50%) translateY(-130%);
      pointer-events: none;
    }

    .toast.show { animation: toast 2.3s ease both; }

    .float {
      position: fixed;
      left: var(--x);
      top: var(--y);
      z-index: 30;
      color: #c3482e;
      font-size: 17px;
      font-weight: 1000;
      text-shadow: 0 2px 0 #fff;
      pointer-events: none;
      animation: float-up .86s ease-out both;
    }

    @keyframes held-wobble {
      0%, 100% { transform: rotate(-4deg) translateY(-1px); }
      50% { transform: rotate(5deg) translateY(2px); }
    }

    @keyframes rain-fall {
      from { transform: translateY(-34px) translateX(0); }
      to { transform: translateY(420px) translateX(-48px); }
    }

    @keyframes snow-fall {
      from { transform: translateY(-34px) translateX(0) rotate(0); }
      to { transform: translateY(420px) translateX(28px) rotate(120deg); }
    }

    @keyframes item-pop {
      from { opacity: 0; transform: scale(.82) rotate(-5deg); }
      to { opacity: 1; transform: scale(1) rotate(var(--spin, 0deg)); }
    }

    @keyframes micro-smile {
      0%, 100% { transform: scale(1); filter: saturate(1.05) contrast(1.04) drop-shadow(0 12px 11px rgba(80,48,30,.2)); }

      if (hour >= 10 && hour < 17) return { id: 'day', label: '白天', mood: '上班' };
      if (hour >= 17 && hour < 22) return { id: 'evening', label: '傍晚', mood: '下班' };
      return { id: 'night', label: '夜里', mood: '省电' };
    }

    function weatherCodeInfo(code) {
      if (code === 0 || code === 1) return { kind: 'sunny', label: '晴' };
      if ([2, 3].includes(code)) return { kind: 'cloudy', label: '多云' };
      if ([45, 48].includes(code)) return { kind: 'fog', label: '雾' };
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code)) return { kind: 'rain', label: '雨' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { kind: 'snow', label: '雪' };
      return { kind: 'cloudy', label: '阴' };
    }

    function fallbackWeather() {
      const day = Math.floor(Date.now() / 86400000);
      const options = [
        { kind: 'sunny', label: '晴', temp: '--', source: 'local' },
        { kind: 'cloudy', label: '阴', temp: '--', source: 'local' },
        { kind: 'rain', label: '小雨', temp: '--', source: 'local' }
      ];
      return options[day % options.length];
    }

    function renderWeatherFx(kind) {
      const nextKind = kind || 'cloudy';
      document.body.classList.remove('weather-sunny', 'weather-cloudy', 'weather-rain', 'weather-snow', 'weather-fog');
      document.body.classList.add('weather-' + nextKind);
      if (weatherFxKind === nextKind) return;
      weatherFxKind = nextKind;
      weatherLayer.innerHTML = '';
      if (nextKind !== 'rain' && nextKind !== 'snow') return;
      const count = nextKind === 'rain' ? 22 : 16;
      for (let i = 0; i < count; i += 1) {
        const drop = document.createElement('span');
        drop.style.left = Math.round(Math.random() * 100) + '%';
        drop.style.top = Math.round(Math.random() * 100) + '%';
        drop.style.animationDelay = (Math.random() * -3).toFixed(2) + 's';
        drop.style.animationDuration = (nextKind === 'rain' ? .82 + Math.random() * .5 : 2.4 + Math.random() * 1.6).toFixed(2) + 's';
        weatherLayer.appendChild(drop);
      }
    }

    function renderWorld() {
      const phase = getPhase();
      state.phase = phase.id;
      document.body.classList.remove('theme-morning', 'theme-day', 'theme-evening', 'theme-night');
      document.body.classList.add('theme-' + phase.id);
      renderWeatherFx(state.weather.kind);
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const temp = state.weather.temp === '--' ? '' : ' ' + state.weather.temp + '°';
      const source = state.weather.source === 'gps' ? '真实天气' : '本地天气';
      worldText.textContent = `${phase.label} ${hh}:${mm} · ${state.weather.label}${temp} · ${source}`;
    }

    function changeStats(delta) {
      state.gloom = clamp(state.gloom + (delta.gloom || 0), 0, 100);
      state.energy = clamp(state.energy + (delta.energy || 0), 0, 100);
      state.bond = clamp(state.bond + (delta.bond || 0), 0, 100);
      state.lastCare = Date.now();
    }

    function completedTasks() {
      return missions.filter((mission) => (state.counts[mission.id] || 0) >= mission.target).length;
    }

    function render() {
      state.coins = Math.round(clamp(state.coins, 0, 999));
      state.gloom = Math.round(clamp(state.gloom, 0, 100));
      state.energy = Math.round(clamp(state.energy, 0, 100));
      state.bond = Math.round(clamp(state.bond, 0, 100));
      coinText.textContent = state.coins;
      gloomText.textContent = state.gloom;
      energyText.textContent = state.energy;
      weatherText.textContent = state.weather.label;
      bookText.textContent = state.unlocked + '/' + badges.length;
      gloomBarText.textContent = state.gloom;
      energyBarText.textContent = state.energy;
      bondBarText.textContent = state.bond;
      gloomBar.style.setProperty('--value', state.gloom + '%');
      energyBar.style.setProperty('--value', state.energy + '%');
      bondBar.style.setProperty('--value', state.bond + '%');
      taskText.textContent = completedTasks() + '/' + missions.length;
      renderWorld();
      renderMissions();
      renderBook();
      renderShop();
      save();
    }

    function renderShop() {
      shop.querySelectorAll('[data-shop]').forEach((button) => {
        const cost = Number(button.dataset.cost || button.textContent.match(/\d+/)?.[0] || 0);
        button.disabled = state.coins < cost;
      });
    }

    async function syncWeather() {
      weatherButton.disabled = true;
      weatherButton.textContent = '同步中';
      const useFallback = (message) => {
        state.weather = fallbackWeather();
        count('weather');
        bubble.textContent = message || '定位没有打开，先用本地天气模拟田中的精神状态。';
        play('coupon');
        render();
        weatherButton.disabled = false;
        weatherButton.textContent = '同步天气';
      };

      if (!navigator.geolocation) {
        useFallback('这个浏览器拿不到定位，先用本地天气模拟。');
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const lat = position.coords.latitude.toFixed(4);
          const lon = position.coords.longitude.toFixed(4);
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=auto`;
          const response = await fetch(url);
          if (!response.ok) throw new Error('weather request failed');
          const data = await response.json();
          const info = weatherCodeInfo(data.current.weather_code);
          state.weather = {
            kind: info.kind,
            label: info.label,
            temp: Math.round(data.current.temperature_2m),
            source: 'gps'
          };
          count('weather');
          changeStats({ gloom: info.kind === 'sunny' ? -4 : info.kind === 'rain' ? 2 : 0, energy: info.kind === 'sunny' ? 2 : 0, bond: 1 });
          setMood('reward', nextLine('weather'), '天气', info.kind === 'rain' ? 'flat' : 'stand');
          play('coupon');
          render();
        } catch {
          useFallback('天气接口刚才没接住，先用本地天气顶上。');
        } finally {
          weatherButton.disabled = false;
          weatherButton.textContent = '同步天气';
        }
      }, () => {
        useFallback('没有开定位，田中改看窗外脑补天气。');
      }, {
        enableHighAccuracy: false,
        timeout: 8000,
        maximumAge: 20 * 60 * 1000
      });
    }

    function lifeTick() {
      if (game.active) return;
      const phase = getPhase();
      let gloom = 1;
      let energy = -1;
      if (phase.id === 'morning') { gloom += 1; energy -= 1; }
      if (phase.id === 'day') { gloom += 2; energy -= 1; }
      if (phase.id === 'evening') { gloom -= 1; energy += 1; }
      if (phase.id === 'night') { gloom -= 1; energy += 2; }
      if (state.weather.kind === 'rain' || state.weather.kind === 'fog') gloom += 1;
      if (state.weather.kind === 'sunny') gloom -= 1;
      if (state.weather.kind === 'snow') energy -= 1;
      changeStats({ gloom, energy, bond: 0 });
      state.lastTick = Date.now();
      autoBehavior(phase);
      reactToVitals();
      render();
    }

    function autoBehavior(phase = getPhase()) {
      if (dragging || Math.random() < .45) return;
      if (state.gloom > 78) {
        setMood('sleep', '田中自己倒下了。丧气太高，需要秀珍或者被窝。', '倒', 'dead');
        return;
      }
      if (state.energy < 24) {
        setMood('sleep', '田中抱着手机省电。可以买被窝让它回体力。', '低电', 'phone');
        return;
      }
      if (phase.id === 'day' && Math.random() > .55) {
        setMood('drop', '田中自动回到工位，开始低功耗营业。', '上班', 'work');
        return;
      }
      if (phase.id === 'night') {
        setMood('sleep', '夜里了，田中进入被窝维护系统。', '晚安', 'phone');
        return;
      }
      if (Math.random() > .68) callPelican(window.innerWidth / 2, window.innerHeight / 2);
    }

    function renderMissions() {
      missionsEl.innerHTML = missions.map((mission) => {
        const count = Math.min(state.counts[mission.id] || 0, mission.target);
        const done = count >= mission.target;
        return '<div class="mission ' + (done ? 'done' : '') + '">' +
          '<span>' + (done ? '已完成：' : '') + mission.label + '</span>' +

    function renderBook() {
      bookEl.innerHTML = badges.map((badge, index) => {

    function initSound() {
      if (!audio) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audio = new AudioContextClass();
      }
      if (audio.state === 'suspended') audio.resume();
      soundReady = true;
      soundButton.classList.add('ready');
      soundButton.textContent = '声音开';
    }

    function note(freq, end, type, len, vol, delay) {
      if (!audio) return;
      const now = audio.currentTime + (delay || 0);
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      const filter = audio.createBiquadFilter();
      osc.type = type;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1300, now);
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, end), now + len);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now + .018);
      gain.gain.exponentialRampToValueAtTime(.0001, now + len);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audio.destination);
      osc.start(now);
      osc.stop(now + len + .04);
    }

    function noise(len, vol, delay) {
      if (!audio) return;
      const now = audio.currentTime + (delay || 0);
      const buffer = audio.createBuffer(1, Math.max(1, audio.sampleRate * len), audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const source = audio.createBufferSource();
      const gain = audio.createGain();
      const filter = audio.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(780, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(.0001, now + len);
      source.buffer = buffer;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.destination);
      source.start(now);
    }

    function play(kind) {
      initSound();
      const sounds = {
        lift: () => { note(360, 520, 'sine', .12, .055); note(480, 640, 'sine', .11, .035, .07); },
        drop: () => { noise(.08, .035); note(180, 118, 'triangle', .16, .06, .02); },
        pat: () => { note(720, 620, 'sine', .08, .045); note(850, 760, 'sine', .09, .036, .08); },
        poke: () => { note(230, 190, 'square', .06, .032); noise(.035, .018, .02); },
        foot: () => { note(540, 280, 'square', .055, .035); note(540, 280, 'square', .055, .032, .1); },
        work: () => { note(210, 160, 'sawtooth', .16, .032); },
        xiuzhen: () => { note(620, 780, 'sine', .12, .045); note(780, 980, 'sine', .14, .035, .1); },
        bag: () => { noise(.12, .035); note(300, 220, 'triangle', .14, .04, .04); },
        bed: () => { note(420, 300, 'sine', .36, .038); note(340, 260, 'sine', .38, .025, .16); },
        soup: () => { note(360, 520, 'square', .1, .035); note(420, 530, 'sine', .12, .03, .08); noise(.05, .018, .04); },
        pelican: () => { note(740, 260, 'sawtooth', .11, .032); note(510, 260, 'square', .055, .03, .1); note(510, 260, 'square', .055, .03, .19); note(510, 260, 'square', .055, .03, .28); },
        shake: () => { note(760, 940, 'square', .06, .033); note(920, 700, 'square', .07, .032, .07); note(1080, 1320, 'sine', .09, .03, .15); },
        dead: () => { note(300, 180, 'sine', .52, .04); },
        meme: () => { noise(.055, .04); note(860, 1280, 'sine', .07, .04, .04); note(1180, 920, 'sine', .09, .034, .12); },
        coin: () => { note(880, 1180, 'sine', .08, .052); note(1320, 980, 'sine', .12, .042, .08); },
        coupon: () => { note(520, 760, 'triangle', .08, .044); note(760, 1120, 'triangle', .1, .036, .09); }
      };
      (sounds[kind] || sounds.pat)();
    }

    function vibrate(ms) {
      if ('vibrate' in navigator) navigator.vibrate(ms);
    }

    function count(id, amount) {
      state.counts[id] = (state.counts[id] || 0) + (amount || 1);
    }

    function floatText(text, x, y) {
      const item = document.createElement('span');
      item.className = 'float';
      item.textContent = text;
      item.style.setProperty('--x', x + 'px');
      item.style.setProperty('--y', y + 'px');
      document.body.appendChild(item);
      item.addEventListener('animationend', () => item.remove());
    }

    function mark(text) {
      moodMark.textContent = text;
      moodMark.classList.remove('show');
      void moodMark.offsetWidth;
      moodMark.classList.add('show');
    }

    function setPose(name, hold) {
      const pose = poses[name] ? name : 'stand';
      tanakaImage.src = poses[pose];
      pet.classList.remove('pose-stand', 'pose-dead', 'pose-work', 'pose-smile', 'pose-flat', 'pose-phone');
      pet.classList.add('pose-' + pose);
      window.clearTimeout(poseTimer);
      if (!hold && pose !== 'stand') {
        poseTimer = window.setTimeout(() => {
          if (!dragging) {
            tanakaImage.src = poses.stand;
            pet.className = 'pet pose-stand';
          }
        }, 4200);
      }
    }

    function showFriend(which) {
      const friend = which === 'xiuzhen' ? xiuzhen : xiaohe;
      friend.classList.remove('show');
      void friend.offsetWidth;
      friend.classList.add('show');
    }

    function showSticker(card) {
      const data = typeof card === 'string'
        ? { text: card, image: '', pose: '' }
        : card || { text: memes[memeCursor % memes.length], image: '', pose: '' };
      stickerText.textContent = data.text || memes[memeCursor % memes.length];
      if (data.image) {
        stickerImg.src = data.image;
        stickerImg.alt = data.text || '田中表情包';
        sticker.classList.add('with-image');
      } else {
        stickerImg.removeAttribute('src');
        stickerImg.alt = '';
        sticker.classList.remove('with-image');
      }
      sticker.classList.remove('show');
      void sticker.offsetWidth;
      sticker.classList.add('show');
    }

    function toastReward(text) {
      toast.textContent = text;
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
    }

    function setMood(className, text, mood, pose, holdPose) {
      const nextPose = pose || 'stand';
      pet.className = 'pet pose-' + nextPose;
      void pet.offsetWidth;
      pet.className = 'pet pose-' + nextPose + ' ' + className;
      setPose(nextPose, holdPose);
      bubble.textContent = text || nextLine(className);
      if (mood) mark(mood);
    }

    function unlockRewards() {
      const unlockAt = [5, 12, 21, 33, 48, 66];
      while (state.unlocked < badges.length && state.coins >= unlockAt[state.unlocked]) {
        state.unlocked += 1;
        play('coin');
        setMood('reward', nextLine('reward'), '+1', 'smile');
        toastReward('解锁：' + badges[state.unlocked - 1]);
      }
    }

    function missionBonus() {
      missions.forEach((mission) => {
          const key = 'bonus_' + mission.id;
        if ((state.counts[mission.id] || 0) >= mission.target && !state[key]) {
          state[key] = true;
          state.coins += mission.reward;
          changeStats({ gloom: -mission.reward, energy: 2, bond: mission.reward });
          unlockRewards();
          play('coin');
          toastReward('关照清单完成：+' + mission.reward + ' 萝卜币');
        }
      });
    }

    function reactToVitals() {
      if (dragging || game.active) return;
      if (state.gloom >= 84) {
        setMood('sleep', '田中丧气过载，自动进入装死保护。', '过载', 'dead');
        return;
      }
      if (state.energy <= 16) {
        setMood('sleep', '田中体力见底，只能先横着充电。', '低电', 'phone');
        return;
      }
      if (state.bond >= 70 && Math.random() > .72) {
        setMood('reward', '田中虽然没说，但它已经有点习惯你照顾它了。', '+亲密', 'smile');
      }
    }

    function addReward(id, coins, care, x, y, delta) {
      if (id) count(id);
      state.coins += coins;
      if (delta) {
        changeStats(delta);
      } else {
        changeStats({
          gloom: -(care || 0),
          energy: Math.max(-3, Math.round((care || 0) / 4)),
          bond: Math.max(1, Math.round((care || 0) / 5))
        });
      }
      if (x && y) floatText('+' + coins + '币', x, y);
      unlockRewards();
      missionBonus();
      reactToVitals();
      render();
    }

    function openCoupon(force) {
      if (!force && state.coins < 4) {
        couponEl.classList.add('show');
        couponEl.textContent = '现实券还差一点萝卜币。先把田中从工位拎走，或者抽张表情包。';
        play('poke');
        return;
      }
      if (!force) state.coins = Math.max(0, state.coins - 4);
      count('coupon');
      changeStats({ gloom: -8, energy: 2, bond: 5 });
      const text = realCoupons[state.counts.coupon % realCoupons.length];
      couponEl.textContent = text;
      couponEl.classList.add('show');
      setMood('reward', nextLine('coupon'), '券', 'phone');
      play('coupon');
      toastReward('现实券到账');
      render();
    }

    function actionZone(zoneName, x, y) {
      const zoneActions = {
        work: { cls: 'drop', sound: 'work', coin: 2, care: 0, delta: { gloom: 7, energy: -6, bond: 0 }, mood: '唉', pose: 'work' },
        xiuzhen: { cls: 'pat', sound: 'xiuzhen', coin: 3, care: 8, delta: { gloom: -12, energy: 3, bond: 8 }, mood: '接住', pose: 'smile', friend: 'xiuzhen' },
        bag: { cls: 'baggy', sound: 'bag', coin: 3, care: 7, delta: { gloom: -9, energy: 2, bond: 3 }, mood: '袋', pose: 'dead' },
        bed: { cls: 'sleep', sound: 'bed', coin: 2, care: 8, delta: { gloom: -8, energy: 12, bond: 3 }, mood: '躺', pose: 'phone' }
      };
      const action = zoneActions[zoneName] || zoneActions.work;
      if (action.friend) showFriend(action.friend);
      addReward(zoneName, action.coin, action.care, x, y, action.delta);
      setMood(action.cls, nextLine(zoneName), action.mood, action.pose);

      showFriend('xiaohe');
      addReward('pelican', 2, 6, x, y);
      setMood('fly', nextLine('pelican'), '叼', 'flat');
      play('pelican');

      setMood('sleep', nextLine('dead'), '躺', 'dead');
      play('dead');
      vibrate(22);

    function spend(cost) {
      if (state.coins < cost) {
        toastReward('萝卜币不够，先去超市逃生');
        play('poke');
        return false;

          if (!spend(4)) return;
          count('shop');
          changeStats({ gloom: -8, energy: 18, bond: 3 });
          setMood('sleep', '被窝盖好。田中开始省电回血。', '被窝', 'phone');
          play('bed');
        },
        antiwork: () => {
          if (!spend(5)) return;
          count('shop');
          changeStats({ gloom: -18, energy: -2, bond: 4 });

    function spawnGameItem() {
      const rect = stage.getBoundingClientRect();
      const roll = Math.random();
      const type = roll > .72 ? 'bad' : roll > .53 ? 'good' : 'coin';
      const item = document.createElement('span');
      item.className = 'game-item ' + type;
      item.textContent = type === 'bad' ? '返工' : type === 'good' ? '秀珍贴' : '萝卜币';
      item.style.left = Math.round(18 + Math.random() * Math.max(1, rect.width - 92)) + 'px';
      item.style.top = Math.round(78 + Math.random() * Math.max(1, rect.height - 188)) + 'px';
      item.style.setProperty('--spin', (Math.random() * 16 - 8).toFixed(1) + 'deg');
      stage.appendChild(item);
      const record = { el: item, type, birth: performance.now() };
      game.items.push(record);
      window.setTimeout(() => {
        if (!game.active) return;
        item.remove();
        game.items = game.items.filter((entry) => entry !== record);
      }, 6200);
    }

    function rectsTouch(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    function collectGameItem(item, x, y) {
      item.el.remove();
      game.items = game.items.filter((entry) => entry !== item);
      if (item.type === 'coin') {
        game.score += 1;
        state.coins += 1;
        count('item');
        changeStats({ gloom: -1, energy: -1, bond: 0 });
        floatText('+1币', x, y);
        play('coin');
        return;
      }
      if (item.type === 'good') {
        game.score += 2;
        count('item');
        changeStats({ gloom: -7, energy: 2, bond: 4 });
        showFriend('xiuzhen');
        setMood('pat', '秀珍贴贴挡住了一张返工单。', '贴贴', 'smile');
        play('xiuzhen');
        return;
      }
      count('hazard');
      changeStats({ gloom: 10, energy: -8, bond: 0 });
      setMood('poke', '返工单砸中田中，丧气暴涨。快拖去超市袋。', '返工', 'work', true);
      play('poke');
      vibrate(38);
    }

    function checkGameCollisions() {
      if (!game.active) return;
      const petRect = pet.getBoundingClientRect();
      game.items.slice().forEach((item) => {
        if (rectsTouch(petRect, item.el.getBoundingClientRect())) {
          collectGameItem(item, petRect.left + petRect.width / 2, petRect.top + petRect.height / 2);
        }
      });
    }

    function gameLoop(now) {
      if (!game.active) return;
      const left = Math.max(0, Math.ceil((game.endAt - now) / 1000));
      gameHud.textContent = `超市逃生 ${left}秒 · ${game.score}分`;
      if (now >= game.endAt) {
        finishEscapeGame(game.score >= 5);
        return;
      }
      if (now >= game.nextSpawnAt) {
        spawnGameItem();
        game.nextSpawnAt = now + 850 + Math.random() * 650;
      }
      if (dragging) checkGameCollisions();
      gameLoopId = requestAnimationFrame(gameLoop);
    }

    function finishEscapeGame(success) {
      if (!game.active) return;
      game.active = false;
      cancelAnimationFrame(gameLoopId);
      gameHud.classList.remove('show');
      clearGameItems();
      if (success) {
        count('escapeWin');
        const bonus = 6 + Math.min(6, game.score);
        state.coins += bonus;
        changeStats({ gloom: -18, energy: -4, bond: 8 });
        setMood('baggy', '超市逃生成功。田中躲进袋子，今晚少上精神班。', '成功', 'dead');
        toastReward('逃生成功 +' + bonus + ' 萝卜币');
        play('coin');
      } else {
        changeStats({ gloom: 5, energy: -4, bond: 1 });
        setMood('drop', '逃生失败，但田中至少动了一下。再试一次会更离谱。', '失败', 'work');
        toastReward('逃生失败，田中记仇中');
        play('drop');
      }
      missionBonus();
      reactToVitals();
      render();
    }

    function tapPet(event) {
      const now = performance.now();
      const doubleTap = now - lastTapTime < 330;
      lastTapTime = now;
      if (doubleTap) {
        playDead(event.clientX, event.clientY);
        return;
      }

      const rect = pet.getBoundingClientRect();
      const localY = event.clientY - rect.top;
      if (localY < rect.height * .32) {
        addReward('pat', 1, 4, event.clientX, event.clientY);
        setMood('pat', nextLine('pat'), '摸', 'smile');
        play('pat');
        vibrate(15);
        return;
      }
      if (localY > rect.height * .74) {
        addReward('foot', 1, 3, event.clientX, event.clientY);
        setMood('poke', nextLine('foot'), '短腿', 'flat');
        play('foot');
        vibrate(12);
        return;
      }
      addReward('poke', 1, 3, event.clientX, event.clientY);
      setMood('poke', nextLine('poke'), '别戳', 'dead');
      play('poke');
      vibrate(10);
    }

    function zoneAt(x, y) {
      return zones.find((zone) => {
        const rect = zone.getBoundingClientRect();
        return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
      });
    }

    function setPetTransform(x, y, active) {
      pet.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + (active ? x / 18 : 0) + 'deg)';
    }

    function beginHold() {
      if (!dragging || holding) return;
      holding = true;
      setMood('held', nextLine('held'), '拎', 'stand', true);
      setPetTransform(0, -18, true);
      play('lift');
      vibrate(14);
    }

    pet.addEventListener('pointerdown', (event) => {
      activePointerId = event.pointerId;
      const rect = pet.getBoundingClientRect();
      offset = {
        x: event.clientX - rect.left - rect.width / 2,
        y: event.clientY - rect.top - rect.height / 2
      };
      startPoint = { x: event.clientX, y: event.clientY };
      dragStartTime = performance.now();
      dragging = true;
      holding = false;
      moved = false;
      shakeScore = 0;
      lastSign = 0;
      pet.setPointerCapture(event.pointerId);
      holdTimer = window.setTimeout(beginHold, 140);
    });

    pet.addEventListener('pointermove', (event) => {
      if (!dragging || event.pointerId !== activePointerId) return;
      const dxStart = event.clientX - startPoint.x;
      const dyStart = event.clientY - startPoint.y;
      if (Math.hypot(dxStart, dyStart) > 8) {
        moved = true;
        beginHold();
      }
      if (!holding) return;

      const rect = stage.getBoundingClientRect();
      const x = event.clientX - rect.left - rect.width / 2 - offset.x;
      const y = event.clientY - rect.top - rect.height / 2 - offset.y;
      setPetTransform(clamp(x, -136, 136), clamp(y, -150, 116), true);

      const hotZone = zoneAt(event.clientX, event.clientY);
      zones.forEach((zone) => zone.classList.toggle('hot', zone === hotZone));

      const sign = Math.abs(dxStart) > 18 ? Math.sign(dxStart) : 0;
      if (sign && lastSign && sign !== lastSign) shakeScore += 1;
      if (sign) lastSign = sign;

      if (shakeScore >= 4) {
        shakeScore = 0;
        addReward('shake', 2, 6, event.clientX, event.clientY);
        const card = memeCards[state.counts.shake % memeCards.length];
        setMood('shake', nextLine('shake'), '晃', card.pose || 'flat');
        showSticker(card);
        play('shake');
        vibrate(30);
      }
    });

    function release(event) {
      if (!dragging || event.pointerId !== activePointerId) return;
      window.clearTimeout(holdTimer);
      if (pet.hasPointerCapture(event.pointerId)) pet.releasePointerCapture(event.pointerId);
      dragging = false;
      activePointerId = null;
      zones.forEach((zone) => zone.classList.remove('hot'));

      const elapsed = Math.max(1, performance.now() - dragStartTime);
      const distance = Math.hypot(event.clientX - startPoint.x, event.clientY - startPoint.y);
      const quick = distance / elapsed > .75;

      if (!holding || (!moved && distance < 12)) {
        setPetTransform(0, 0, false);
        tapPet(event);
        return;
      }

      const targetZone = zoneAt(event.clientX, event.clientY);
      setPetTransform(0, 0, false);
      addReward('lift', 1, 3, event.clientX, event.clientY);

      if (targetZone) {
        if (game.active && targetZone.dataset.zone === 'bag') {
          finishEscapeGame(true);
          return;
        }
        actionZone(targetZone.dataset.zone, event.clientX, event.clientY);
        return;
      }

      if (quick) {
        callPelican(event.clientX, event.clientY);
        return;
      }

      setMood('drop', nextLine('drop'), '落');
      play('drop');
      vibrate(22);
    }

    pet.addEventListener('pointerup', release);
    pet.addEventListener('pointercancel', release);

    soundButton.addEventListener('click', () => {
      initSound();
      play('xiuzhen');
      bubble.textContent = '声音打开了。田中仍然很丧，但现在丧得有声。';
    });

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'xiuzhen') actionZone('xiuzhen', window.innerWidth / 2, window.innerHeight / 2);
        if (action === 'pelican') callPelican(window.innerWidth / 2, window.innerHeight / 2);
        if (action === 'work') actionZone('work', window.innerWidth / 2, window.innerHeight / 2);
        if (action === 'escape') startEscapeGame();
        if (action === 'dead') playDead(window.innerWidth / 2, window.innerHeight / 2);
        if (action === 'meme') drawMeme(window.innerWidth / 2, window.innerHeight / 2);
        if (action === 'coupon') openCoupon(false);
      });
    });

    shop.addEventListener('click', (event) => {
      const button = event.target.closest('[data-shop]');
      if (button) buyItem(button.dataset.shop);
    });

    weatherButton.addEventListener('click', syncWeather);

    lifeTimer = window.setInterval(lifeTick, 6500);
    worldTimer = window.setInterval(() => {
      renderWorld();
    }, 30000);

    window.setInterval(() => {
      if (dragging) return;
      setMood('sleep', nextLine('idle'), '唉', Math.random() > .55 ? 'phone' : 'flat');
    }, 45000);

    state.weather = state.weather && state.weather.kind ? state.weather : fallbackWeather();
    renderWorld();
    render();
  </script>
</body>
</html>
